name: Bug report
description: Report a reproducible problem in React Metronome.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private recordings or personal data. Provide tempo, browser and device details where possible.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version and operating system
    validations:
      required: false
