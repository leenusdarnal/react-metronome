version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-updates:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
